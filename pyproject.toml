[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeod"
version = "0.2.0"
description = "Zero-Annotation-OD: VLM-based auto-labeling + YOLOv8 helmet detection, fully local on Windows"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }

dependencies = [
    "ultralytics>=8.3.0,<9",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "requests>=2.31,<3",
    "numpy>=1.26,<3",
    "pillow>=10.0,<12",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "radon>=6.0",
]
release = ["pyinstaller>=6.0"]

[project.scripts]
zeod = "zeod.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zeod"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py310"
extend-exclude = ["legacy", "scratch", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
